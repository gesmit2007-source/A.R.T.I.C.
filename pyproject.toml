[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["artic"]

[project]
name = "artic"
version = "0.1.0"
description = "A.R.T.I.C. - non-ephemeral AI with an Obsidian vault as permanent memory"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest"]
[project.scripts]
artic = "artic.__main__:main"
